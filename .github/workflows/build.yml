name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create app config
        run: |
          echo 'SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"' > app_config.py
          echo 'SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"' >> app_config.py

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error