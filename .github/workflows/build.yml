name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create app config
        run: |
          echo 'SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"' > app_config.py
          echo 'SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"' >> app_config.py
          echo "app_config.py created"

      - name: Build Flet APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find "${{ steps.build.outputs.output-path }}" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            find "${{ steps.build.outputs.output-path }}" -type f
            exit 1
          fi

          echo "APK found: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.path }}" "MyTasks.apk"
          ls -lh MyTasks.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: MyTasks.apk
          if-no-files-found: error
          archive: true

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "My Tasks v1.0.${{ github.run_number }}"
          files: MyTasks.apk
          generate_release_notes: true