name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create app config
        run: |
          echo 'SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"' > app_config.py
          echo 'SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"' >> app_config.py
          echo "app_config.py created"

      - name: Install Flet CLI
        run: |
          python3.14 -m pip install --upgrade pip
          python3.14 -m pip install "flet[all]" supabase

      - name: Check Flet
        run: |
          flet --version

      - name: Build APK
        run: |
          flet build apk --yes --python-version 3.14