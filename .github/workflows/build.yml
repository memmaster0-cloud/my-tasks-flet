name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create app config
        run: |
          echo 'SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"' > app_config.py
          echo 'SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"' >> app_config.py
          cat app_config.py

      - name: Show project files
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 2 -type f | sort
          echo "===== PYPROJECT ====="
          cat pyproject.toml

      - name: Install Flet CLI
        run: |
          python3.14 -m pip install --upgrade pip
          python3.14 -m pip install flet-cli flet supabase

      - name: Check Flet
        run: |
          python3.14 -m flet --version
          python3.14 -c "import flet; print('Flet import OK')"

      - name: Build APK
        run: |
          python3.14 -m flet build apk --yes