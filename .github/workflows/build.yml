name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Supabase config
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cat > app_config.py <<EOF
          SUPABASE_URL = ${SUPABASE_URL@Q}
          SUPABASE_KEY = ${SUPABASE_KEY@Q}
          EOF

          echo "Checking app_config.py..."
          test -s app_config.py
          sed 's/SUPABASE_URL = .*/SUPABASE_URL = "***HIDDEN***"/; s/SUPABASE_KEY = .*/SUPABASE_KEY = "***HIDDEN***"/' app_config.py

      - name: Build Flet APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          archive: false